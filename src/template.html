            <button type="button" class="nav-action project-action" data-action="project">
                <p class="nav-label">Projects</p>
            </button>
        </div>
        <div id="nav-projects">
            <div id="projects-header">
                <p id="projects-title">Projects</p>
                <button type="button" id="projects-add">+</button>
            </div>
            <div id="project-list">
                <button type="button" class="project-item">

                    <span class="project-name">Work</span>
                    <span class="projects-count">2</span>
                </button>
                <button type="button" class="project-item">

                <button type="button" class="project-item">
                    <span class="project-color"></span>
                    <span class="project-name">Work</span>
                    <span class="projects-count">2</span>
                </button>
            </div>

        </div>
    </nav>
