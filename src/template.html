<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Site Name</title>
</head>

<body>
    <header id="logo-section">
        <div id="logo-contents">
            <span id="logo-symbol">+</span>
            <p id="logo-name">manifest</p>
        </div>
    </header>
    <main id="main-content">

    </main>
    <nav id="main-nav">
        <button id="add-intention">+ <span>Add Intention</span></button>
        <div id="nav-sections">
            <button type="button" class="nav-action" data-action="today">
                <p class="nav-label">Today</p>
                <p class="count" data-count="today-count">4</p>
            </button>
            <button type="button" class="nav-action" data-action="upcoming">
                <p class="nav-label">Upcoming</p>
                <p class="count" data-count="upcoming-count"></p>
            </button>
            <button type="button" class="nav-action" data-action="inbox">
                <p class="nav-label">Inbox</p>
                <p class="count" data-count="inbox-count"></p>
            </button>
            <button type="button" class="nav-action project-action" data-action="project">
                <p class="nav-label">Projects</p>
                <p class="count" data-count="project-count"></p>
            </button>
        </div>
        <div id="nav-projects">
            <div id="projects-header">
                <p id="projects-title">Projects</p>
                <button type="button" id="projects-add">+</button>
            </div>
            <div id="project-list">
                <button type="button" class="project-item">
                    <span class="project-color"></span>
                    <p class="project-name">Work</p>
                    <p class="projects-count">2</p>
                </button>
                <button type="button" class="project-item">
                    <span class="project-color"></span>
                    <p class="project-name">Work</p>
                    <p class="projects-count">2</p>
                </button>
                <button type="button" class="project-item">
                    <span class="project-color"></span>
                    <p class="project-name">Work</p>
                    <p class="projects-count">2</p>
                </button>
            </div>

        </div>
    </nav>
</body>

</html>
